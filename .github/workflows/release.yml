name: Release WoW Addon

on:
  push:
    branches: [main, master]
    paths:
      - "GrimoirePulse/GrimoirePulse.toc"
      - "GrimoirePulse/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate TOC version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^## Version:[[:space:]]*([0-9]+(\.[0-9]+)*)[[:space:]]*$/\1/p' GrimoirePulse/GrimoirePulse.toc)"
          test -n "$VERSION"
          test "$(printf '%s\n' "$VERSION" | wc -l)" -eq 1

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "A release for v$VERSION already exists."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS="$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n1 | sed 's/^v//')"
          if [ -n "$PREVIOUS" ] && { [ "$VERSION" = "$PREVIOUS" ] || [ "$(printf '%s\n%s\n' "$PREVIOUS" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; }; then
            echo "TOC version $VERSION is not higher than the latest release $PREVIOUS." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build installable ZIP
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/GrimoirePulse
          rsync -a GrimoirePulse/ build/GrimoirePulse/
          cd build
          zip -r "../GrimoirePulse-${{ steps.version.outputs.version }}.zip" GrimoirePulse -x '*.DS_Store' -x '*/.gitkeep'

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GrimoirePulse v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: GrimoirePulse-${{ steps.version.outputs.version }}.zip
